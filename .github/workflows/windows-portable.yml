name: Windows x64 portable draft

on:
  pull_request:
    paths:
      - '.github/workflows/windows-portable.yml'
      - 'bagu_trainer/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'release_tests/**'
      - 'requirements*.txt'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag; must match bagu_trainer/version.py (for example v0.2.0)'
        required: true
        default: v0.2.0
        type: string

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.event.pull_request.number || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10.11'
          architecture: x64
      - name: Install isolated build and test dependencies
        run: |
          python -m venv .venv-build
          .\.venv-build\Scripts\python.exe -m pip install -r requirements-build.txt
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Build audited onedir ZIP and SHA-256
        run: .\.venv-build\Scripts\python.exe scripts/build_portable.py
      - name: Test source workflows and the actual portable EXE
        run: python -m pytest release_tests -q -W error --junitxml=validation/release-tests.xml
      - name: Build and run the separate frozen acceptance driver
        run: |
          .\.venv-build\Scripts\python.exe scripts/build_acceptance.py --verify --memory-credentials --work build/frozen-acceptance
          Copy-Item -LiteralPath build/frozen-acceptance/ACCEPTANCE.json -Destination validation/ACCEPTANCE.json
      - name: Prepare release notes and validate provenance
        if: github.event_name == 'workflow_dispatch'
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/release_portable.py --tag "$env:RELEASE_TAG" --output validation/RELEASE_NOTES.md
      - name: Preserve validation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validation/
            build/pyinstaller/windows/warn-windows.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Transfer verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-portable-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/BaguTrainer-*-windows-x64.zip
            dist/BaguTrainer-*-windows-x64.zip.sha256
            validation/RELEASE_NOTES.md
            validation/release-tests.xml
            validation/ACCEPTANCE.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve clean Windows acceptance kit separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clean-windows-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/BaguTrainerAcceptance-windows-x64.zip
            dist/BaguTrainerAcceptance-windows-x64.zip.sha256
            scripts/acceptance/*.ps1
            CLEAN_WINDOWS_ACCEPTANCE.md
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10.11'
          architecture: x64
      - name: Download only this run's verified files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: windows-portable-${{ github.run_id }}-${{ github.run_attempt }}
        run: gh run download "$env:RUN_ID" --name "$env:ARTIFACT_NAME" --dir release-files
      - name: Create or update draft only; never publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-and-test.outputs.tag }}
        run: python scripts/release_portable.py --tag "$env:RELEASE_TAG" --dist release-files/dist --output release-files/validation/RELEASE_NOTES.md --publish-draft
